name: Snap store login export
on:
  workflow_dispatch:

jobs:
  export-login:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Export login (waits for web approval)
        run: |
          sudo script -qec "snapcraft export-login --snaps=nostromo --channels=stable,candidate,beta,edge /tmp/snap.login" /tmp/typescript.log || true
          echo "=== pty output ==="
          cat /tmp/typescript.log || true
          test -s /tmp/snap.login

      - name: Set repo secret
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          gh secret set SNAPCRAFT_STORE_CREDENTAILS -R pokanop/nostromo < /tmp/snap.login || \
          gh secret set SNAPCRAFT_STORE_CREDENTIALS -R pokanop/nostromo < /tmp/snap.login

      - name: Cleanup
        if: always()
        run: sudo rm -f /tmp/tmp/snap.login /tmp/typescript.log
